name: Unlimited Agent desktop (macOS)

# Builds the branded "Unlimited Agent" desktop app (unsigned) for Apple Silicon.
# Run manually from the Actions tab; the DMG is attached as a workflow artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Build Unlimited Agent (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TARGET: aarch64-apple-darwin
      # In-app updates: the app checks this feed and installs signed builds with one click.
      BUZZ_UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDg5RUFDNDQyMUUwQzE0REIKUldUYkZBd2VRc1RxaVhCOGRzTEpVSUNtNFpKNklERitiM3ljTjRmZW14VW8zQW9lVWJzckpiZ2gK
      BUZZ_UPDATER_ENDPOINT: https://app.unlimitedsolutions.technology/dl/updater.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Apply Unlimited branding
        run: |
          python3 unlimited/brand.py
          cd desktop && pnpm tauri icon ../unlimited/brand/icon-1024.png

      - name: Version and updater config
        run: |
          REL=$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+-[0-9]+" unlimited/overrides/desktop/src/features/unlimited/updates/release.ts | head -1)
          N=${REL##*-}
          echo "APP_VERSION=0.6.$N" >> "$GITHUB_ENV"
          cd desktop && node scripts/set-version-from-tag.mjs "0.6.$N" && node scripts/build-release-config.mjs

      - name: Build sidecars
        run: |
          rustup target add "$TARGET"
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build app (ad-hoc signed)
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles app,dmg --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UNLIMITED_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UNLIMITED_UPDATER_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unlimited-agent-macos-arm64
          path: |
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14
