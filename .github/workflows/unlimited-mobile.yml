name: Unlimited Agent mobile (iOS)

# Builds the branded "Unlimited Agent" iPhone app.
# - simulator: an unsigned app for the iOS Simulator on a Mac (artifact: unlimited-agent-ios-simulator).
# - testflight: a signed build uploaded to TestFlight. Needs the App Store Connect API key secrets
#   (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) and the team id variable (UNLIMITED_TEAM_ID).
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also upload a signed build to TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  simulator:
    name: Build for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install Flutter dependencies
        run: cd mobile && flutter pub get
      - name: Apply Unlimited branding
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true
          python3 unlimited/brand_mobile.py
          cd mobile && flutter pub get
      - name: Build simulator app
        run: cd mobile && flutter build ios --simulator --debug --no-pub
      - name: Package
        run: |
          cd mobile/build/ios/iphonesimulator
          APP=$(ls -d *.app | head -1)
          [ "$APP" = "Unlimited Agent.app" ] || mv "$APP" "Unlimited Agent.app"
          ditto -c -k --sequesterRsrc --keepParent "Unlimited Agent.app" "$GITHUB_WORKSPACE/Unlimited-Agent-Simulator.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unlimited-agent-ios-simulator
          path: Unlimited-Agent-Simulator.zip
          if-no-files-found: error
          retention-days: 14

  testflight:
    name: Upload to TestFlight
    if: ${{ inputs.testflight }}
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      UNLIMITED_TEAM_ID: ${{ vars.UNLIMITED_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check signing setup
        run: |
          missing=""
          [ -n "$UNLIMITED_TEAM_ID" ] || missing="$missing UNLIMITED_TEAM_ID(variable)"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install Flutter dependencies
        run: cd mobile && flutter pub get
      - name: Apply Unlimited branding
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true
          python3 unlimited/brand_mobile.py
          cd mobile && flutter pub get
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          K=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # Shape check only (never prints the key): PEM header, line count, parses as a private key.
          echo "first line: $(head -1 "$K")"; echo "lines: $(wc -l < "$K")"
          openssl pkey -in "$K" -noout && echo "key parses OK" || { echo "::error::ASC_KEY_P8 is not a valid .p8 private key"; exit 1; }
      - name: Check the key against the App Store Connect API
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<PY
          import os, time, jwt, urllib.request, urllib.error
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{kid}.p8")).read()
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=5", headers={"Authorization": "Bearer " + tok})
          try:
              r = urllib.request.urlopen(req, timeout=30); print("ASC API:", r.status)
          except urllib.error.HTTPError as e:
              print("ASC API:", e.code, e.read()[:300]); raise SystemExit(1)
          PY
      - name: Build archive (unsigned; signed at export)
        run: |
          cd mobile
          flutter build ios --release --no-pub --config-only --build-number "${{ github.run_number }}"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$UNLIMITED_TEAM_ID" CODE_SIGNING_ALLOWED=NO archive
          # Signing happens in the export step (cloud-managed App Store signing through the API key).
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${UNLIMITED_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove key
        if: always()
        run: rm -rf ~/.appstoreconnect
