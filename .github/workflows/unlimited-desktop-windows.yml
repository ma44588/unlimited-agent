name: Unlimited Agent desktop (Windows)

# Builds the branded "Unlimited Agent" desktop app for Windows x64 (NSIS installer, not code-signed yet).
# The installer and its updater signature are uploaded as a workflow artifact; the server publishes them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Unlimited Agent (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc
      PYTHONUTF8: "1"
      BUZZ_UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDg5RUFDNDQyMUUwQzE0REIKUldUYkZBd2VRc1RxaVhCOGRzTEpVSUNtNFpKNklERitiM3ljTjRmZW14VW8zQW9lVWJzckpiZ2gK
      BUZZ_UPDATER_ENDPOINT: https://app.unlimitedsolutions.technology/dl/updater.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Apply Unlimited branding
        shell: bash
        run: |
          python unlimited/brand.py
          cd desktop && pnpm tauri icon ../unlimited/brand/icon-1024.png

      - name: Version and updater config
        shell: bash
        run: |
          REL=$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+-[0-9]+" unlimited/overrides/desktop/src/features/unlimited/updates/release.ts | head -1)
          N=${REL##*-}
          echo "APP_VERSION=0.6.$N" >> "$GITHUB_ENV"
          cd desktop && node scripts/set-version-from-tag.mjs "0.6.$N" && node scripts/build-release-config.mjs

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build Windows installer
        shell: bash
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UNLIMITED_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UNLIMITED_UPDATER_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unlimited-agent-windows-x64
          path: |
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 14
