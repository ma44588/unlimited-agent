<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Join your workspace · Unlimited Agent</title>
<link rel="icon" href="/brand/favicon.png">
<style>
  :root {
    --bg: #f4eff7; --card: #ffffff; --fg: #1d1a22; --muted: #6b6475; --line: #e7e0ee;
    --accent: #43195b; --accent-fg: #ffffff; --soft: #f6f2f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17131c; --card: #201b27; --fg: #efeaf4; --muted: #a79fb2; --line: #322a3c;
            --accent: #e9ddf3; --accent-fg: #2a1238; --soft: #2a2333; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  .wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .brand span { font-weight: 600; font-size: 15px; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .host { margin: 22px 0 24px; padding: 14px 16px; border-radius: 12px; background: var(--soft);
          font-size: 15px; overflow-wrap: anywhere; }
  .btn { display: block; width: 100%; padding: 14px 18px; border: 0; border-radius: 999px; cursor: pointer;
         background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; font-size: 15px;
         text-align: center; text-decoration: none; }
  .btn:focus-visible, a:focus-visible { outline: 3px solid #a46cc7; outline-offset: 3px; }
  .note { margin-top: 14px; font-size: 13px; }
  .foot { text-align: center; font-size: 14px; color: var(--muted); padding: 16px; }
  .foot a { color: var(--fg); font-weight: 600; }
  .error { color: #b4233c; }
  @media (prefers-color-scheme: dark) { .error { color: #ff8a9b; } }
</style>
</head>
<body>
<main class="wrap">
  <section class="card" aria-labelledby="title">
    <div class="brand"><img src="/brand/icon.png" alt=""><span>Unlimited Agent</span></div>
    <h1 id="title">You're invited</h1>
    <p>Join your team's workspace in Unlimited Agent.</p>
    <div class="host" id="host"></div>
    <a class="btn" id="open" href="#">Open in Unlimited Agent</a>
    <p class="note" id="note">The app opens and adds you to the workspace. Keep this page open until it does.</p>
  </section>
  <div class="foot">Don't have the app yet? <a href="/dl/Unlimited-Agent.dmg" id="dl">Download for Mac</a></div>
</main>
<script>
  (function () {
    var code = decodeURIComponent((location.pathname.split("/invite/")[1] || "").split("/")[0]);
    var host = location.host;
    document.getElementById("host").textContent = host;
    var open = document.getElementById("open");
    var note = document.getElementById("note");
    if (!code) {
      open.setAttribute("aria-disabled", "true");
      open.removeAttribute("href");
      note.className = "note error";
      note.textContent = "This invite link is incomplete. Ask for a new one.";
      return;
    }
    var q = new URLSearchParams({ relay: "wss://" + host, code: code });
    open.href = "buzz://join?" + q.toString();
  })();
</script>
</body>
</html>
