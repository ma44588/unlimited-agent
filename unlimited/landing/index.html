<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unlimited Agent</title>
<link rel="icon" href="/brand/favicon.png">
<style>
  :root { --fg:#2b2b2b; --muted:#6b6b6b; --bg:#f6f6f7; --card:#ffffff; --line:#e6e6ea; }
  @media (prefers-color-scheme: dark) { :root { --fg:#ececf1; --muted:#a3a3ad; --bg:#151518; --card:#1d1d21; --line:#2c2c33; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--bg); color:var(--fg); font-family: "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif; }
  main { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:16px;
         padding:40px 32px; text-align:center; }
  .logo { width:100%; max-width:300px; height:auto; }
  @media (prefers-color-scheme: dark) { .logo { background:#fff; border-radius:10px; padding:10px 14px; } }
  h1 { margin:28px 0 8px; font-size:22px; font-weight:600; letter-spacing:.2px; }
  p { margin:0 0 6px; line-height:1.7; color:var(--muted); font-size:15px; }
  .en { direction:ltr; font-size:13px; margin-top:18px; }
  .lock { display:inline-flex; align-items:center; gap:8px; margin-top:24px; padding:8px 14px; border:1px solid var(--line);
          border-radius:999px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <img class="logo" src="/brand/logo.png" alt="Unlimited Solutions">
  <h1>Unlimited Agent</h1>
  <p>مساحة العمل الخاصة بفريق Unlimited Solutions ووكلاء الذكاء الاصطناعي.</p>
  <p>الدخول بدعوة فقط. لو وصلك رابط دعوة افتحه من الرسالة.</p>
  <p class="en">Private workspace of Unlimited Solutions. Access is by invitation only.</p>
  <span class="lock">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    Invite only
  </span>
</main>
</body>
</html>
